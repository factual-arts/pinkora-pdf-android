name: Pinkora PDF - Build Android APK

on:
  push:
    paths:
      - 'PinkoraPDF-Android-Source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Pinkora PDF debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify source archive exists
        run: test -s PinkoraPDF-Android-Source.zip

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p _pinkora_source
          unzip -q PinkoraPDF-Android-Source.zip -d _pinkora_source
          test -f _pinkora_source/PinkoraPDF/settings.gradle.kts
          test -f _pinkora_source/PinkoraPDF/app/build.gradle.kts
          test -f _pinkora_source/PinkoraPDF/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK Platform 36 and Build Tools 36.0.0
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Run unit tests and build debug APK
        run: >-
          gradle
          -p _pinkora_source/PinkoraPDF
          --no-daemon
          --stacktrace
          :app:testDebugUnitTest
          :app:assembleDebug

      - name: Verify APK package and version metadata
        shell: bash
        run: |
          APK='_pinkora_source/PinkoraPDF/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "name='com.quantexapp.pinkorapdf.app'"
          echo "$BADGING" | grep -F "versionCode='1'"
          echo "$BADGING" | grep -F "versionName='Long Star ONE'"
          echo "### Pinkora PDF APK build result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`com.quantexapp.pinkorapdf.app\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`Long Star ONE\` (code 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK as a direct, non-zipped artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: _pinkora_source/PinkoraPDF/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
